<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon Patrimoine">
<meta name="theme-color" content="#050507">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Mon Patrimoine</title>
<style>
:root{
  color-scheme: dark;
  --bg:#050507; --card:#15151b; --card2:#1f1f28; --sheet:#0e0e13; --surface:#15151b; --surface2:#1f1f28;
  --text:#f5f5f7; --text2:#b4b4bf; --muted:#80808d; --line:rgba(255,255,255,.07);
  --accent:#8b92ff; --accent-strong:#5b63f5;
  --c-banque:#3987e5; --c-bourse:#d95926; --c-societe:#199e70; --c-crypto:#c98500;
  --good:#2fd17a; --bad:#ff6b6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
main{max-width:560px;margin:0 auto;padding:0 16px calc(100px + env(safe-area-inset-bottom));transition:filter .15s}
body.veil main,body.veil .sheet-wrap,body.veil .tabbar{filter:blur(24px)}

/* en-tête en dégradé */
.hero{position:relative;margin:0 -16px;padding:calc(env(safe-area-inset-top) + 14px) 20px 30px;text-align:center;overflow:hidden;
  background:linear-gradient(180deg,rgba(5,5,7,0) 40%,var(--bg) 100%),
    radial-gradient(90% 75% at 0% 0%,#3a5cff 0%,rgba(58,92,255,0) 70%),
    radial-gradient(80% 70% at 100% 8%,#a93cf2 0%,rgba(169,60,242,0) 72%),
    radial-gradient(60% 50% at 60% 60%,rgba(255,79,154,.35) 0%,rgba(255,79,154,0) 70%),
    #1a1446}
.top{display:flex;align-items:center;gap:10px;text-align:left;margin-bottom:24px}
.logo{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);color:#fff;font-weight:800;font-size:12.5px;letter-spacing:-.3px;display:grid;place-items:center}
.brand{font-weight:650;font-size:16px;flex:1;color:rgba(255,255,255,.92)}
.hero .label{color:rgba(255,255,255,.72);font-size:14px;font-weight:500}
.hero .total{font-size:46px;font-weight:700;letter-spacing:-1.6px;margin:4px 0 12px;line-height:1.05;color:#fff}
.delta{display:inline-flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;max-width:100%;font-size:13.5px;font-weight:650;padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.13);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.delta:empty{display:none}
.delta.up{color:#86ffbd} .delta.down{color:#ffb3b3} .delta.flat{color:rgba(255,255,255,.85)}
.delta .since{color:rgba(255,255,255,.62);font-weight:500}
.updated{color:rgba(255,255,255,.55);font-size:12px;margin-top:10px}
.updated:empty{display:none}
.actions{display:flex;justify-content:center;gap:28px;margin-top:24px}
.act{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.92)}
.act .ico{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15)}
.act svg{width:22px;height:22px}
.act.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero.compact{padding-bottom:16px}
.hero.compact .top{margin-bottom:14px}
.hero.compact .total{font-size:32px;margin:2px 0 8px}
.hero.compact .actions,.hero.compact .updated{display:none}

/* cartes et listes */
.card{background:var(--card);border-radius:22px;padding:18px;margin:14px 0}
.card h2{font-size:16px;margin:0;font-weight:650}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.sec-title{font-size:19px;font-weight:700;margin:24px 4px 10px;letter-spacing:-.2px}
.card.list{padding:6px 0}
.row-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;text-align:left}
.row-item .main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-item .name{font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-item .sub{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-item .val{font-weight:650;text-align:right;font-size:15.5px;white-space:nowrap}
.row-item .val small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.cico{width:42px;height:42px;border-radius:50%;flex:0 0 42px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 20%,transparent)}
.cico svg{width:21px;height:21px}
.avatar{width:42px;height:42px;border-radius:50%;flex:0 0 42px;display:grid;place-items:center;font-weight:700;font-size:16px;color:#fff;background:var(--c)}
.chg{font-weight:650;font-size:14.5px;white-space:nowrap}
.chg.up{color:var(--good)} .chg.down{color:var(--bad)} .chg.flat{color:var(--muted)}
.cat{margin:20px 0 4px}
.cat-head{display:flex;align-items:center;gap:12px;padding:0 4px}
.cat-head .cico{width:34px;height:34px;flex-basis:34px}
.cat-head .cico svg{width:18px;height:18px}
.cat-head h3{margin:0;font-size:19px;font-weight:700;flex:1}
.cat-head .sum{font-weight:700;font-size:16px}
.cat .card{margin-top:10px}
.add-line{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;color:var(--accent);font-weight:600;font-size:15px;text-align:left}
.add-line .plus{width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:grid;place-items:center;background:var(--card2);font-size:22px;font-weight:500}
.welcome{text-align:center;padding:26px 18px}
.welcome h2{font-size:20px}
.welcome p{color:var(--text2);margin:8px 0 20px}
.welcome-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.welcome-grid button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:18px;background:var(--card2);font-weight:600}

/* graphiques */
.seg{display:flex;gap:2px;background:var(--card2);border-radius:999px;padding:3px}
.seg button{padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text2)}
.seg button.on{background:#fff;color:#000}
.chart{position:relative;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;overflow:visible;touch-action:pan-y}
.axis{fill:var(--muted);font-size:11px}
.grid{stroke:var(--line);stroke-width:1}
.tip{position:absolute;top:0;pointer-events:none;background:#2b2b36;color:#fff;border-radius:12px;padding:7px 10px;font-size:12.5px;line-height:1.3;white-space:nowrap;transform:translateX(-50%);box-shadow:0 6px 18px rgba(0,0,0,.45)}
.tip b{font-size:14px}
.empty-chart{color:var(--muted);font-size:14px;padding:26px 8px;text-align:center}
.donut-row{display:flex;align-items:center;gap:16px}
.donut{flex:0 0 150px}
.donut svg{display:block;width:150px;height:150px}
.donut circle.seg-c{cursor:pointer;transition:stroke-width .15s}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.leg{display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:8px;padding:7px 8px;border-radius:12px;text-align:left}
.leg.on{background:var(--card2)}
.dot{width:10px;height:10px;border-radius:50%}
.leg .n{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg .v{font-size:13px;text-align:right}
.leg .v small{display:block;color:var(--muted);font-size:12px}

/* barre d'onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(12,12,16,.8);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-top:1px solid var(--line)}
.tabbar button{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 0}
.tabbar svg{width:24px;height:24px}
.tabbar button.on{color:#fff}

/* feuilles (ajout, réglages) */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);animation:fade .18s}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:92vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;border-top:1px solid var(--line);animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.sheet-bar h2{font-size:17px;margin:0}
.sheet-bar button{color:var(--accent);font-weight:600;min-width:64px}
.sheet-bar button.r{text-align:right;font-weight:700}
.sheet-body{overflow:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.group{background:var(--card);border-radius:16px;margin:10px 0;overflow:hidden}
.group-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:20px 6px 6px;font-weight:600}
.field{display:flex;align-items:center;gap:10px;padding:13px 16px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field label{flex:0 0 auto;color:var(--text2);font-size:15px}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;text-align:right;font-size:16px}
.field input.left{text-align:left}
.hint{color:var(--muted);font-size:13px;margin:8px 6px 0;line-height:1.45}
.hint a{color:var(--accent)}
.cats-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--card);padding:4px;border-radius:999px}
.cats-pick button{padding:9px 2px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text2)}
.cats-pick button.on{background:#fff;color:#000}
.pos{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.pos:first-child{border-top:0}
.pos .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos .s{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos .q{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.pos .q input{width:96px;border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:var(--card2);text-align:right;font-size:16px;outline:none}
.pos .rm{color:var(--bad);font-size:20px;line-height:1;padding:4px}
.pos .pv{grid-column:2;text-align:right;font-size:13px;color:var(--text2)}
.search{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.search input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:10px 14px;background:var(--card2);outline:none;font-size:16px}
.btn{background:var(--accent-strong);color:#fff;border-radius:999px;padding:10px 16px;font-weight:650}
.btn.wide{display:block;width:100%;padding:15px;text-align:center;margin-top:12px}
.btn.danger{background:rgba(255,107,107,.12);color:var(--bad)}
.btn:disabled{opacity:.5}
.results button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:11px 16px;border-top:1px solid var(--line)}
.results .t{font-weight:600}
.results .s{color:var(--muted);font-size:12.5px}
.link-btn{color:var(--accent);font-weight:600;padding:13px 16px;display:block;width:100%;text-align:left;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.switch{position:relative;width:51px;height:31px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:#3a3a46;border-radius:999px;transition:.2s}
.switch span:before{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.switch input:checked+span{background:#34c759}
.switch input:checked+span:before{transform:translateX(20px)}

/* fenêtre de confirmation (remplace confirm(), bloqué dans les web apps iPhone) */
.dlg-wrap{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.6);animation:fade .15s}
.dlg{background:#1c1c24;border:1px solid var(--line);border-radius:22px;padding:22px 18px 16px;width:100%;max-width:340px;text-align:center}
.dlg p{margin:0 0 18px;font-size:16px;line-height:1.4}
.dlg .btns{display:flex;gap:10px}
.dlg .btns button{flex:1;padding:13px;border-radius:999px;font-weight:650;background:var(--card2)}
.dlg .btns .ok{background:var(--accent-strong);color:#fff}
.dlg .btns .ok.danger{background:#e5484d}

/* verrouillage */
.lock{position:fixed;inset:0;z-index:50;background:radial-gradient(70% 45% at 50% 32%,rgba(90,70,230,.55) 0%,rgba(90,70,230,0) 70%),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:14px}
.lock .big-logo{width:86px;height:86px;border-radius:50%;background:linear-gradient(150deg,#3a5cff,#a93cf2);color:#fff;font-weight:800;font-size:32px;display:grid;place-items:center;letter-spacing:-1px;box-shadow:0 12px 40px rgba(110,70,240,.5)}
.lock h1{font-size:22px;margin:6px 0 0}
.lock p{color:var(--text2);margin:0}
.lock .pin{width:200px;text-align:center;font-size:24px;letter-spacing:10px;border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--card);outline:none}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b2b36;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;z-index:60;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:fade .2s}
</style>
</head>
<body>

<div id="lock" class="lock" hidden>
  <div class="big-logo">MP</div>
  <h1>Mon Patrimoine</h1>
  <p id="lockMsg">Application verrouillée</p>
  <button id="unlockFace" class="btn" style="padding:13px 22px">Déverrouiller avec Face ID</button>
  <button id="usePin" class="link-btn" style="width:auto;border:0;text-align:center">Utiliser le code</button>
  <input id="pinInput" class="pin num" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" hidden aria-label="Code">
</div>

<main id="app">
  <section class="hero" id="hero">
    <div class="top"><div class="logo" aria-hidden="true">MP</div><div class="brand">Mon Patrimoine</div></div>
    <div class="label">Patrimoine total</div>
    <div class="total num" id="total">0 €</div>
    <div class="delta flat" id="delta"></div>
    <div class="updated" id="updated"></div>
    <div class="actions">
      <button class="act" id="fab"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Ajouter</button>
      <button class="act" id="refreshBtn"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></span>Actualiser</button>
      <button class="act" id="settingsBtn"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></span>Réglages</button>
    </div>
  </section>

  <div id="content"></div>
</main>

<nav class="tabbar" id="tabbar">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button data-tab="evo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="M8 15l3.5-4 3 2.5L20 7"/></svg>Évolution</button>
  <button data-tab="accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg>Comptes</button>
</nav>

<div id="sheet" class="sheet-wrap" hidden><div class="sheet" role="dialog" aria-modal="true"><div id="sheetInner"></div></div></div>

<script>
'use strict';
/* ---------- constantes ---------- */
const CATS = [
  {id:'banque',  name:'Banques', one:'Banque',  ph:'Ex : Boursorama, Livret A'},
  {id:'bourse',  name:'Bourse',  one:'Bourse',  ph:'Ex : PEA Fortuneo, CTO'},
  {id:'societe', name:'Société', one:'Société', ph:'Ex : Ma SASU (trésorerie)'},
  {id:'crypto',  name:'Crypto',  one:'Crypto',  ph:'Ex : Ledger, Binance'}
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const KEY = 'mp.data.v1';
const RANGES = [['1M',30],['3M',91],['1A',365],['Tout',0]];
const DEFAULT = {v:1, accounts:[], history:[], prices:{}, fx:{}, meta:{cryptoAt:0, stockAt:0},
  settings:{avKey:'', lock:false, credId:'', pinHash:'', pinSalt:'', pinLen:0}, ui:{range:'1A'}};

/* ---------- utilitaires ---------- */
const $ = (s, r = document) => r.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt0 = new Intl.NumberFormat('fr-FR', {style:'currency', currency:'EUR', maximumFractionDigits:0});
const fmt2 = new Intl.NumberFormat('fr-FR', {style:'currency', currency:'EUR', minimumFractionDigits:2, maximumFractionDigits:2});
const eur = (n, dec) => (dec ? fmt2 : fmt0).format(n || 0);
const pct = n => (n * 100).toLocaleString('fr-FR', {maximumFractionDigits:1}) + ' %';
const qtyFmt = n => (n || 0).toLocaleString('fr-FR', {maximumFractionDigits:8});
function priceFmt(n){
  if (n == null) return '—';
  return n.toLocaleString('fr-FR', n < 1 ? {maximumSignificantDigits:4} : {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
}
function compact(n){
  const a = Math.abs(n);
  if (a >= 1e6) return (n/1e6).toLocaleString('fr-FR', {maximumFractionDigits:2}) + ' M€';
  if (a >= 1e4) return Math.round(n/1e3).toLocaleString('fr-FR') + ' k€';
  if (a >= 1e3) return (n/1e3).toLocaleString('fr-FR', {maximumFractionDigits:1}) + ' k€';
  return Math.round(n) + ' €';
}
function parseNum(s){
  if (typeof s === 'number') return s;
  const v = parseFloat(String(s || '').replace(/[\s  €]/g, '').replace(',', '.'));
  return isFinite(v) ? v : 0;
}
const numIn = n => (n ? String(Math.round(n * 1e8) / 1e8).replace('.', ',') : '');
function today(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
const dayMs = s => new Date(s + 'T12:00:00').getTime();
const shortDate = s => new Date(s + 'T12:00:00').toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
const longDate = s => new Date(s + 'T12:00:00').toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'});
function ago(t){
  if (!t) return '';
  const m = Math.round((Date.now() - t) / 60000);

const normCur = c => (c || 'EUR').toUpperCase();
function posPrice(p){
  const pr = S.prices[p.src + ':' + p.id];
  if (!pr || typeof pr.p !== 'number') return null;
  if (p.src === 'cg') return pr.p;
  let price = pr.p, cur = normCur(pr.cur || p.cur);
  if (cur === 'GBX') { price /= 100; cur = 'GBP'; }
  if (cur === 'EUR') return price;
  const rate = S.fx.rates && S.fx.rates[cur];
  return rate ? price / rate : null;
}
function accValue(a){
  let v = a.cash || 0, missing = 0;
  for (const p of a.positions || []) {
    const pr = posPrice(p);
    if (pr == null) { if (p.qty) missing++; } else v += (p.qty || 0) * pr;
  }
  return {v, missing};
}
function totals(){
  const byCat = {banque:0, bourse:0, societe:0, crypto:0}; let total = 0;
  for (const a of S.accounts) { const {v} = accValue(a); byCat[a.cat] = (byCat[a.cat] || 0) + v; total += v; }
  for (const k in byCat) byCat[k] = Math.round(byCat[k] * 100) / 100;
  return {total: Math.round(total * 100) / 100, byCat};
}
function snapshot(){
  if (!S.accounts.length) return;
  migrateFlows();
  const t = totals(), d = today(), e = {d, t: t.total, c: t.byCat, f: S.flows.total, fc: {...S.flows.byCat}}, h = S.history;
  if (h.length && h[h.length - 1].d === d) h[h.length - 1] = e; else h.push(e);
  h.sort((a, b) => a.d < b.d ? -1 : 1);
  save();
}
/* Ajouter, modifier ou supprimer un compte n'est pas un gain ni une perte : ces « mouvements » sont
   cumulés dans S.flows et retirés des variations, qui ne reflètent donc que les cours. */
const r2 = x => Math.round(x * 100) / 100;
function migrateFlows(){
  if (S.flows && typeof S.flows.total === 'number') return;
  const h = S.history, h0 = h[0], t = totals(), c0 = (h0 && h0.c) || {};
  S.flows = {total: 0, byCat: {}};
  if (h0) {
    for (const p of h) { p.f = r2(p.t - h0.t); p.fc = {}; for (const c of CATS) p.fc[c.id] = r2(((p.c && p.c[c.id]) || 0) - (c0[c.id] || 0)); }
    S.flows.total = r2(t.total - h0.t);
    for (const c of CATS) S.flows.byCat[c.id] = r2((t.byCat[c.id] || 0) - (c0[c.id] || 0));
  }
  save();
}
function recordFlow(before){
  migrateFlows();
  const after = totals();
  S.flows.total = r2(S.flows.total + after.total - before.total);
  for (const c of CATS) S.flows.byCat[c.id] = r2((S.flows.byCat[c.id] || 0) + (after.byCat[c.id] || 0) - (before.byCat[c.id] || 0));
}
function perfSince(p, value, cat){
  const f0 = cat ? p.fc && p.fc[cat] : p.f, v0 = cat ? p.c && p.c[cat] : p.t;
  if (typeof f0 !== 'number' || typeof v0 !== 'number') return null;

async function ovQuote(p){
  const j = await fetchJSON(OV + 'instruments/' + encodeURIComponent(p.type || 'FUND') + '/' + encodeURIComponent(p.id) + '/snapshot');
  const list = ((j.quoteList && j.quoteList.list) || []).filter(q => q && typeof q.last === 'number');
  const code = q => q.market && q.market.codeMarket;
  const eurs = list.filter(q => q.isoCurrency === 'EUR').sort((a, b) => String(b.datetimeLast || '').localeCompare(String(a.datetimeLast || '')));
  const best = eurs.find(q => code(q) === '_LSX') || eurs[0] || j.quote;   // LS Exchange = bourse de Trade Republic, sinon le cours EUR le plus récent
  if (!best || typeof best.last !== 'number') throw new Error('vide');

function setSpinning(on){ $('#refreshBtn').classList.toggle('spin', on); }
async function refreshPrices(force = false){
  if (refreshing) return; refreshing = true; setSpinning(true);
  const errs = []; const now = Date.now();
  try {
    const cg = [...new Set(allPositions('cg').map(p => p.id))];
    if (cg.length && (force || now - (S.meta.cryptoAt || 0) > 5 * 60e3)) {
      try { await cgPrices(cg); S.meta.cryptoAt = Date.now(); } catch (e) { errs.push('crypto'); }
    }
    const ov = [...new Map(allPositions('ov').map(p => [p.id, p])).values()];
    const stale = ov.filter(p => { const pr = S.prices['ov:' + p.id]; return force || !pr || now - pr.t > 15 * 60e3; });
    if (stale.length) {
      const res = await Promise.allSettled(stale.map(p => ovQuote(p)));
      if (res.some(r => r.status === 'rejected')) errs.push('bourse');
      S.meta.stockAt = Date.now();
    }
    if (ov.some(p => normCur((S.prices['ov:' + p.id] || {}).cur) !== 'EUR') && (force || now - (S.fx.t || 0) > 12 * 3600e3)) { try { await refreshFx(); } catch (e) { errs.push('devises'); } }
  } finally {
    save(); snapshot(); render();
    refreshing = false; setSpinning(false);
  }
  if (errs.length) toast('Certains cours n’ont pas pu être mis à jour (' + [...new Set(errs)].join(', ') + ')', 3600);
  else if (force) toast('Cours à jour');
}

/* courbe d'évolution */
function niceStep(span, n){ const raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag; }
function drawLine(){
  const el = $('#lineChart'); if (!el) return;
  const pts = rangePoints();
  if (pts.length < 2) {
    el.innerHTML = `<div class="empty-chart">La courbe se remplit toute seule : un point est enregistré chaque jour où tu ouvres l'app.<br><br>Reviens demain pour voir le 2ᵉ point 📈</div>`;
    return;
  }
  const W = Math.max(260, el.clientWidth || 320), H = 210, pl = 4, pr = 10, pt = 14, pb = 24;
  const xs = pts.map(p => dayMs(p.d)), ys = pts.map(p => p.t);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi - lo < 1) { lo -= Math.max(1, Math.abs(lo) * 0.02); hi += Math.max(1, Math.abs(hi) * 0.02); }
  const step = niceStep(hi - lo, 3); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x0 = xs[0], x1 = xs[xs.length - 1];
  const X = t => pl + (t - x0) / (x1 - x0) * (W - pl - pr);
  const Y = v => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
  let grid = '';
  for (let v = lo; v <= hi + step / 2; v += step) {
    const y = Y(v).toFixed(1);
    grid += `<line class="grid" x1="0" x2="${W}" y1="${y}" y2="${y}"/><text class="axis num" x="0" y="${(Y(v) - 4).toFixed(1)}">${compact(v)}</text>`;
  }
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(xs[i]).toFixed(1) + ' ' + Y(p.t).toFixed(1)).join(' ');
  const area = d + ` L${X(x1).toFixed(1)} ${H - pb} L${X(x0).toFixed(1)} ${H - pb} Z`;
  const lx = X(x1), ly = Y(ys[ys.length - 1]);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Évolution du patrimoine total">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".18"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#ag)"/>
    <path d="${d}" fill="none" style="stroke:var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lx}" cy="${ly}" r="5" style="fill:var(--accent);stroke:var(--surface)" stroke-width="2"/>
    <text class="axis" x="${pl}" y="${H - 6}">${shortDate(pts[0].d)}</text>
    <text class="axis" x="${W - pr}" y="${H - 6}" text-anchor="end">${shortDate(pts[pts.length - 1].d)}</text>
    <g id="hover" style="display:none"><line id="hl" y1="${pt}" y2="${H - pb}" style="stroke:var(--muted)" stroke-width="1" stroke-dasharray="3 3"/><circle id="hc" r="5" style="fill:var(--accent);stroke:var(--surface)" stroke-width="2"/></g>
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" id="hit"/>
  </svg><div class="tip" id="tip" hidden></div>`;
  const svg = el.querySelector('svg'), tip = $('#tip'), g = $('#hover');
  const move = ev => {
    const r = svg.getBoundingClientRect(); const cx = (ev.clientX - r.left) * (W / r.width);
    let best = 0, bd = Infinity; xs.forEach((x, i) => { const dd = Math.abs(X(x) - cx); if (dd < bd) { bd = dd; best = i; } });
    const px = X(xs[best]), py = Y(ys[best]);
    g.style.display = ''; $('#hl').setAttribute('x1', px); $('#hl').setAttribute('x2', px); $('#hc').setAttribute('cx', px); $('#hc').setAttribute('cy', py);
    tip.hidden = false; tip.innerHTML = `${longDate(pts[best].d)}<br><b class="num">${eur(ys[best])}</b>`;
    const left = px * (r.width / W); const half = tip.offsetWidth / 2;
    tip.style.left = Math.min(Math.max(left, half), r.width - half) + 'px';
    tip.style.top = Math.max(0, py * (r.height / H) - tip.offsetHeight - 12) + 'px';
  };
  const out = () => { g.style.display = 'none'; tip.hidden = true; };
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', out); svg.addEventListener('pointercancel', out);
}

/* camembert */
function drawDonut(t){
  const el = $('#donut'), lg = $('#legend'); if (!el) return;
  const sum = posSum(t), R = 60, SW = 22, C = 2 * Math.PI * R, GAP = 2;
  const parts = CATS.map(k => ({k, v: Math.max(0, t.byCat[k.id])})).filter(p => p.v > 0);
  let off = 0, segs = '';
  for (const p of parts) {
    const len = p.v / sum * C, on = selCat === p.k.id;
    const dash = parts.length > 1 ? Math.max(0.5, len - GAP) : len;
    segs += `<circle class="seg-c" data-cat="${p.k.id}" cx="75" cy="75" r="${R}" fill="none" style="stroke:var(--c-${p.k.id})" stroke-width="${on ? SW + 6 : SW}"
      stroke-dasharray="${dash.toFixed(2)} ${(C - dash).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 75 75)" opacity="${selCat && !on ? .35 : 1}"/>`;
    off += len;
  }
  if (!parts.length) segs = `<circle cx="75" cy="75" r="${R}" fill="none" style="stroke:var(--line)" stroke-width="${SW}"/>`;
  const sel = selCat && parts.find(p => p.k.id === selCat);
  const c1 = sel ? sel.k.name : 'Total', c2 = sel ? pct(sel.v / sum) : compact(t.total);
  el.innerHTML = `<svg viewBox="0 0 150 150" role="img" aria-label="Répartition par catégorie">${segs}
    <text x="75" y="70" text-anchor="middle" style="fill:var(--muted)" font-size="12">${esc(c1)}</text>
    <text x="75" y="90" text-anchor="middle" style="fill:var(--text)" font-size="17" font-weight="700" class="num">${esc(c2)}</text></svg>`;
  lg.innerHTML = CATS.map(k => {
    const v = t.byCat[k.id];
    return `<button class="leg ${selCat === k.id ? 'on' : ''}" data-cat="${k.id}"><span class="dot" style="background:var(--c-${k.id})"></span><span class="n">${k.name}</span><span class="v num">${compact(v)}<small>${pct(Math.max(0, v) / sum)}</small></span></button>`;
  }).join('');
}

    const w = document.createElement('div'); w.className = 'dlg-wrap';
    w.innerHTML = `<div class="dlg" role="alertdialog"><p>${esc(msg)}</p><div class="btns"><button class="no">Annuler</button><button class="ok${danger ? ' danger' : ''}">${esc(okLabel)}</button></div></div>`;
    const done = v => { w.remove(); res(v); };
    w.querySelector('.no').onclick = () => done(false);
    w.querySelector('.ok').onclick = () => done(true);
    w.onclick = e => { if (e.target === w) done(false); };
    document.body.appendChild(w);
  });
}

/* ---------- éditeur de compte ---------- */
let draft = null, searchRes = [], searching = false;
function openEditor(id, cat){
  const a = id && S.accounts.find(x => x.id === id);
  draft = a ? clone(a) : {id: uid(), cat: cat || 'banque', name: '', cash: 0, note: '', positions: [], _new: true};
  searchRes = []; renderEditor(true);
}
function renderEditor(first){
  const a = draft, k = CAT[a.cat], hasPos = a.cat === 'bourse' || a.cat === 'crypto';
  const cashLabel = {banque:'Solde', societe:'Montant', bourse:'Liquidités', crypto:'Montant en €'}[a.cat];
  const body = `
  <div class="sheet-bar"><button id="edCancel">Annuler</button><h2>${a._new ? 'Nouveau' : 'Modifier'}</h2><button class="r" id="edSave">OK</button></div>
  <div class="sheet-body">
    <div class="cats-pick" id="edCat">${CATS.map(c => `<button data-c="${c.id}" class="${c.id === a.cat ? 'on' : ''}">${c.one}</button>`).join('')}</div>
    <div class="group">
      <div class="field"><label for="edName">Nom</label><input id="edName" class="left" placeholder="${esc(k.ph)}" value="${esc(a.name)}" autocomplete="off"></div>
      <div class="field"><label for="edCash">${cashLabel}</label><input id="edCash" class="num" inputmode="decimal" placeholder="0" value="${numIn(a.cash)}" autocomplete="off"><span style="color:var(--muted)">€</span></div>
      ${a.cat === 'societe' ? `<div class="field"><label for="edNote">Note</label><input id="edNote" class="left" placeholder="Ex : trésorerie, valeur des parts" value="${esc(a.note || '')}"></div>` : ''}
    </div>
    ${a.cat === 'bourse' ? `<p class="hint">Mets ici l'argent non investi. Pour un suivi simple, tu peux aussi juste y mettre la valeur totale du compte.</p>` : ''}
    ${a.cat === 'crypto' ? `<p class="hint">Optionnel : euros ou stablecoins posés sur la plateforme. Ajoute tes cryptos ci-dessous pour le cours automatique.</p>` : ''}
    ${hasPos ? posSection(a) : ''}
    ${!a._new ? `<button class="btn wide danger" id="edDel">Supprimer ce compte</button>` : ''}
  </div>`;
  if (first) openSheet(body, () => { draft = null; }); else $('#sheetInner').innerHTML = body;
  bindEditor();
}
function posSection(a){
  const isC = a.cat === 'crypto';
  const rows = (a.positions || []).map((p, i) => {
    const pr = posPrice(p);
    return `<div class="pos"><div style="min-width:0"><div class="t">${esc(p.sym)}</div><div class="s">${esc(p.name)}${p.region ? ' · ' + esc(p.region) : ''}</div></div>
      <div class="q"><input data-q="${i}" inputmode="decimal" placeholder="Qté" value="${numIn(p.qty)}" aria-label="Quantité ${esc(p.sym)}"><button class="rm" data-rm="${i}" aria-label="Retirer">×</button></div>
      <div class="s">${pr == null ? 'cours en attente' : 'cours ' + priceFmt(pr)}</div><div class="pv num" data-pv="${i}">${pr == null ? '—' : eur(pr * (p.qty || 0))}</div></div>`;
  }).join('');
  return `<div class="group-title">${isC ? 'Cryptos (cours automatique)' : 'Titres (cours automatique)'}</div>
  <div class="group">
    ${rows || `<div class="row" style="color:var(--muted);font-size:14px">${isC ? 'Aucune crypto ajoutée' : 'Aucun titre ajouté'}</div>`}
    <div class="search"><input id="edQ" placeholder="${isC ? 'Ex : bitcoin, ETH, solana' : 'Nom ou ISIN, ex : Amundi MSCI World'}" autocomplete="off" enterkeyhint="search"><button class="btn" id="edSearch">${searching ? '…' : 'Chercher'}</button></div>
    <div class="results">${searchRes.map((r, i) => `<button data-pick="${i}"><span style="min-width:0;display:block"><span class="t" style="display:block">${esc(r.sym)}</span><span class="s">${esc(r.name)}</span></span></button>`).join('')}</div>
  </div>
  ${!isC ? `<p class="hint">Cherche par nom ou, plus sûr, par code ISIN (12 caractères, ex : LU1681043599) : il est affiché dans l'appli de ton courtier. Les tickers type « CW8 » ne marchent pas. Cours en euros, sur la même bourse que Trade Republic (LS Exchange), sans clé ni limite.</p>` : ''}`;
}
function bindEditor(){
  const a = draft;
  $('#edCancel').onclick = closeSheet;
  $('#edSave').onclick = saveDraft;
  $('#edName').oninput = e => a.name = e.target.value;
  $('#edCash').oninput = e => a.cash = parseNum(e.target.value);
  const note = $('#edNote'); if (note) note.oninput = e => a.note = e.target.value;
  $('#edCat').onclick = e => { const b = e.target.closest('[data-c]'); if (!b || b.dataset.c === a.cat) return;
    a.positions = [];
    a.cat = b.dataset.c; searchRes = []; renderEditor(); };
  document.querySelectorAll('[data-q]').forEach(inp => inp.oninput = e => {
    const i = +e.target.dataset.q, p = a.positions[i]; p.qty = parseNum(e.target.value);
    const pr = posPrice(p); const cell = document.querySelector(`[data-pv="${i}"]`); if (cell) cell.textContent = pr == null ? '—' : eur(pr * p.qty);
  });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { a.positions.splice(+b.dataset.rm, 1); renderEditor(); });
  const q = $('#edQ'), sb = $('#edSearch');
  if (q) { q.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); doSearch(q.value); } }; sb.onclick = () => doSearch(q.value); }
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => pick(searchRes[+b.dataset.pick]));
  const del = $('#edDel'); if (del) del.onclick = async () => {
    if (!await askConfirm('Supprimer « ' + (a.name || CAT[a.cat].one) + ' » ?', 'Supprimer', true)) return;
    const before = totals(); S.accounts = S.accounts.filter(x => x.id !== a.id); recordFlow(before); save(); snapshot(); closeSheet(); render(); toast('Compte supprimé');
  };
}
async function doSearch(qs){
  qs = (qs || '').trim(); if (!qs || searching) return;
  searching = true; renderEditor(); $('#edQ').value = qs;
  try {
    if (draft.cat === 'crypto') {
      const r = await fetchJSON('https://api.coingecko.com/api/v3/search?query=' + encodeURIComponent(qs));
      searchRes = (r.coins || []).slice(0, 8).map(c => ({src:'cg', id:c.id, sym:(c.symbol || '').toUpperCase(), name:c.name}));
    } else {
      // le nom affiché par Trade Republic ne colle pas toujours : on réessaie avec un nom simplifié
      const seen = new Set(), found = [];
      const clean = qs.replace(/\([^)]*\)/g, ' ').replace(/\b(ucits|etf|eur|usd|acc|dist?|c|d)\b/gi, ' ').replace(/[^\p{L}\p{N}&]+/gu, ' ').replace(/\s+/g, ' ').trim();
      for (const v of [...new Set([qs, clean, clean.replace(/\bcore\b/gi, ' ').replace(/\s+/g, ' ').trim()])]) {
        if (!v || found.length >= 6) continue;
        const r = await fetchJSON(OV + 'instruments/search/facet?searchValue=' + encodeURIComponent(v));
        for (const x of (r.facets || []).filter(f => ['ETF', 'FUND', 'STOCK'].includes(f.type)).flatMap(f => f.results || []))
          if (x && x.entityValue && !seen.has(x.entityValue)) { seen.add(x.entityValue); found.push(x); }
      }
      const ql = qs.toLowerCase(), wantAcc = /\bacc|capi/.test(ql), wantDis = /\bdist?\b|distri/.test(ql);
      const toks = clean.toLowerCase().split(' ').filter(t => t.length > 1);
      const score = x => { const n = (x.name || '').toLowerCase(); let s = toks.filter(t => n.includes(t)).length;
        if (wantAcc) s += /acc|\(c\)/.test(n) ? 3 : /dis|\(d\)/.test(n) ? -3 : 0;
        if (wantDis) s += /dis|\(d\)/.test(n) ? 3 : /acc|\(c\)/.test(n) ? -3 : 0;
        return s; };
      found.sort((a, b) => score(b) - score(a));
      searchRes = found.slice(0, 10)
        .map(x => ({src:'ov', id:String(x.entityValue), type:x.entityType, sym:x.name, name:(x.isin || '') + (x.entityType === 'STOCK' ? ' · Action' : ' · ETF / fonds')}));
    }
    if (!searchRes.length) toast('Aucun résultat');
  } catch (e) {
    toast('Recherche impossible (connexion ?)');
  }
  searching = false;
  if (draft) { renderEditor(); const q = $('#edQ'); if (q) q.value = qs; }
}
async function pick(r){
  if (!r || !draft) return;
  draft.positions = draft.positions || [];
  if (!draft.positions.some(p => p.src === r.src && p.id === r.id)) draft.positions.push({src:r.src, id:r.id, type:r.type || '', sym:r.sym, name:r.name, qty:0});
  searchRes = []; renderEditor();
  const inputs = document.querySelectorAll('[data-q]'); const last = inputs[inputs.length - 1]; if (last) last.focus();
  try {
    if (r.src === 'cg') await cgPrices([r.id]);
    else { await ovQuote(r); const c = normCur(S.prices['ov:' + r.id].cur); if (c !== 'EUR' && !(S.fx.rates && S.fx.rates[c === 'GBX' ? 'GBP' : c])) await refreshFx(); }
    save();
    if (draft) { const keep = [...document.querySelectorAll('[data-q]')].map(i => i.value); renderEditor(); document.querySelectorAll('[data-q]').forEach((i, n) => { if (keep[n] != null) i.value = keep[n]; }); }
  } catch (e) { toast('Cours indisponible pour le moment'); }
}
function saveDraft(){
  const a = draft; if (!a) return;
  a.name = (a.name || '').trim() || CAT[a.cat].one;
  a.positions = a.positions || [];
  const isNew = a._new; delete a._new;
  const before = totals();
  if (isNew) S.accounts.push(a); else S.accounts = S.accounts.map(x => x.id === a.id ? a : x);
  recordFlow(before); save(); snapshot(); closeSheet(); render();
  toast(isNew ? 'Compte ajouté' : 'Enregistré');
}

/* ---------- réglages ---------- */
function openSettings(){
  const s = S.settings;
  openSheet(`
  <div class="sheet-bar"><span style="min-width:64px"></span><h2>Réglages</h2><button class="r" id="stDone">OK</button></div>
  <div class="sheet-body">
    <div class="group-title">Sécurité</div>
    <div class="group">
      <div class="row"><span>Verrouillage Face ID</span><label class="switch"><input type="checkbox" id="stLock" ${s.lock ? 'checked' : ''}><span></span></label></div>
      <div id="lockSetup" hidden>
        <div class="field"><label for="pin1">Code de secours</label><input id="pin1" class="num" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="4 à 6 chiffres" autocomplete="off"></div>
        <div class="field"><label for="pin2">Confirmer</label><input id="pin2" class="num" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="Retape-le" autocomplete="off"></div>
        <div style="padding:0 14px 14px"><button class="btn wide" id="lockGo">Activer Face ID</button></div>
      </div>
    </div>
    <p class="hint">${s.lock ? (s.credId ? 'Face ID actif. Le code sert si Face ID échoue.' : 'Verrouillage par code actif (Face ID indisponible sur cet appareil).') : "L'app demandera Face ID à chaque ouverture. Le code de secours sert si Face ID échoue."}</p>

    <div class="group-title">Sauvegarde</div>
    <div class="group">
      <button class="link-btn" style="border-top:0" id="stExport">Exporter une sauvegarde</button>
      <button class="link-btn" id="stImport">Importer une sauvegarde</button>
      <input type="file" id="stFile" accept="application/json,.json" hidden>
    </div>
    <p class="hint">Tes données restent uniquement sur ce téléphone (rien n'est envoyé sur internet, sauf les noms de cryptos/titres pour obtenir leur cours). Exporte une sauvegarde de temps en temps, par exemple dans Fichiers ou iCloud Drive.</p>

    <div class="group-title">Données</div>
    <div class="group"><button class="link-btn" style="border-top:0;color:var(--bad)" id="stWipe">Tout effacer</button></div>
    <p class="hint" style="text-align:center;margin-top:24px">Mon Patrimoine · v2.2</p>
  </div>`);
  $('#stDone').onclick = () => { closeSheet(); render(); };
  $('#stLock').onchange = e => {
    if (e.target.checked) { $('#lockSetup').hidden = false; $('#pin1').focus(); }
    else { $('#lockSetup').hidden = true; if (S.settings.lock) { Object.assign(S.settings, {lock:false, credId:'', pinHash:'', pinSalt:'', pinLen:0}); save(); toast('Verrouillage désactivé'); } }
  };
  $('#lockGo').onclick = enableLock;
  $('#stExport').onclick = exportData;
  $('#stImport').onclick = () => $('#stFile').click();
  $('#stFile').onchange = importData;
  $('#stWipe').onclick = async () => {
    if (!await askConfirm('Effacer tous tes comptes et ton historique ? Pense à exporter une sauvegarde avant.', 'Continuer', true)) return;
    if (!await askConfirm('Vraiment tout effacer ? Ce n’est pas réversible.', 'Tout effacer', true)) return;
    S = clone(DEFAULT); save(); closeSheet(); render(); toast('Données effacées');
  };
}

/* ---------- verrouillage (Face ID via WebAuthn + code) ---------- */
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
async function hashPin(pin, salt){ const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin)); return b64u(d); }
async function faceAvailable(){ try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; } }
async function enableLock(){
  const p1 = $('#pin1').value, p2 = $('#pin2').value;
  if (!/^\d{4,6}$/.test(p1)) { toast('Le code doit faire 4 à 6 chiffres'); return; }
  if (p1 !== p2) { toast('Les deux codes ne correspondent pas'); return; }
  const salt = b64u(rnd(16)); const hash = await hashPin(p1, salt);
  let credId = '';
  if (await faceAvailable()) {
    try {
      const cred = await navigator.credentials.create({publicKey: {
        challenge: rnd(32), rp: {name: 'Mon Patrimoine', id: location.hostname},
        user: {id: rnd(16), name: 'mon-patrimoine', displayName: 'Mon Patrimoine'},
        pubKeyCredParams: [{type:'public-key', alg:-7}, {type:'public-key', alg:-257}],
        authenticatorSelection: {authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred'},
        timeout: 60000, attestation: 'none'}});
      credId = b64u(cred.rawId);
    } catch (e) { toast('Face ID non activé (' + (e.name || 'erreur') + '). Verrouillage par code seulement.', 4000); }
  } else toast('Face ID indisponible ici : verrouillage par code.', 3500);
  Object.assign(S.settings, {lock:true, credId, pinHash:hash, pinSalt:salt, pinLen:p1.length}); save();
  if (credId) toast('Face ID activé ✅');
  closeSheet(); openSettings();
}
let locked = false, hiddenAt = 0;
function lockNow(){
  locked = true; $('#lock').hidden = false; $('#app').hidden = true; $('#fab').hidden = true;
  if ($('#sheet') && !$('#sheet').hidden) closeSheet();
  $('#unlockFace').hidden = !S.settings.credId; $('#pinInput').hidden = !!S.settings.credId; $('#usePin').hidden = !S.settings.credId;
  $('#pinInput').value = ''; $('#lockMsg').textContent = 'Application verrouillée';
  if (!S.settings.credId) setTimeout(() => $('#pinInput').focus(), 200);
}
function unlock(){
  locked = false; $('#lock').hidden = true; $('#app').hidden = false; $('#fab').hidden = false;
  render(); refreshPrices(false);
}
async function tryFace(auto){
  if (!S.settings.credId) return;
  try {
    await navigator.credentials.get({publicKey: {challenge: rnd(32), rpId: location.hostname, userVerification: 'required', timeout: 60000,
      allowCredentials: [{type:'public-key', id: unb64u(S.settings.credId), transports:['internal','hybrid']}]}});
    unlock();
  } catch (e) { if (!auto) $('#lockMsg').textContent = 'Face ID annulé — réessaie ou utilise le code'; }
}
$('#unlockFace').onclick = () => tryFace(false);
$('#usePin').onclick = () => { $('#pinInput').hidden = false; $('#pinInput').focus(); };
$('#pinInput').oninput = async e => {
  const v = e.target.value.replace(/\D/g, ''); e.target.value = v;
  if (v.length < (S.settings.pinLen || 4)) return;
  if (await hashPin(v, S.settings.pinSalt) === S.settings.pinHash) unlock();
  else { e.target.value = ''; e.target.classList.remove('shake'); void e.target.offsetWidth; e.target.classList.add('shake'); $('#lockMsg').textContent = 'Code incorrect'; }
};
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); document.body.classList.add('veil'); }
  else {
    document.body.classList.remove('veil');
    if (S.settings.lock && !locked && Date.now() - hiddenAt > 30e3) { lockNow(); tryFace(true); }
    else if (!locked) { snapshot(); refreshPrices(false); }
  }
});

/* ---------- sauvegarde ---------- */
async function exportData(){
  const data = clone(S); data.settings = Object.assign({}, data.settings, {lock:false, credId:'', pinHash:'', pinSalt:'', pinLen:0});
  const name = 'mon-patrimoine-' + today() + '.json';
  const file = new File([JSON.stringify(data, null, 1)], name, {type:'application/json'});
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:'Sauvegarde Mon Patrimoine'}); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function importData(e){
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.accounts) || !Array.isArray(d.history)) throw new Error('format');
    if (!await askConfirm('Remplacer tes données actuelles par cette sauvegarde (' + d.accounts.length + ' comptes) ?', 'Remplacer', true)) return;
    const keep = {lock:S.settings.lock, credId:S.settings.credId, pinHash:S.settings.pinHash, pinSalt:S.settings.pinSalt, pinLen:S.settings.pinLen};
    localStorage.setItem(KEY, JSON.stringify(d)); S = load(); migrateFlows(); Object.assign(S.settings, keep); save();
    closeSheet(); render(); refreshPrices(true); toast('Sauvegarde importée');
  } catch (err) { toast('Fichier de sauvegarde invalide'); }
}

/* ---------- événements ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-add],[data-edit],[data-r],[data-cat]'); if (!t) return;
  if (t.dataset.add) openEditor(null, t.dataset.add);
  else if (t.dataset.edit) openEditor(t.dataset.edit);
  else if (t.dataset.r) { S.ui.range = t.dataset.r; save(); render(); }
  else if (t.dataset.cat && t.closest('#donut,#legend')) { selCat = selCat === t.dataset.cat ? null : t.dataset.cat; drawDonut(totals()); }
});
$('#fab').onclick = () => openEditor(null, 'banque');
$('#settingsBtn').onclick = openSettings;
$('#refreshBtn').onclick = () => refreshPrices(true);
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (!locked) drawLine(); }, 150); });

/* ---------- démarrage ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (S.settings.lock && S.settings.pinHash) { lockNow(); tryFace(true); }
else { render(); snapshot(); refreshPrices(false); }
</script>
